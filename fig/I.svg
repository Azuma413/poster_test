  <circle cx="88" cy="88" r="8.75" fill="none" stroke="#000000" stroke-width="8.5" />
  <circle cx="142" cy="105" r="6.75" fill="none" stroke="#000000" stroke-width="6.5" />

  <!-- ロボットアーム：リンク -->
