    <path d="M 128,132 C 128,118 152,118 152,135 C 152,146 143,150 141,158 C 139,165 130,165 128,157" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <path d="M 134,133 C 134,126 145,126 145,135 C 145,141 138,144 137,149" fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- 分岐する点線矢印 -->
  <line x1="255" y1="105" x2="274" y2="105" stroke="#000000" stroke-width="4" stroke-dasharray="5, 4.5" stroke-linecap="round" />
  <line x1="274" y1="105" x2="274" y2="52" stroke="#000000" stroke-width="4" stroke-dasharray="6, 5.7" stroke-linecap="round" />
  <line x1="274" y1="105" x2="274" y2="158" stroke="#000000" stroke-width="4" stroke-dasharray="6, 5.7" stroke-linecap="round" />
  <line x1="274" y1="52" x2="294" y2="52" stroke="#000000" stroke-width="4" stroke-dasharray="5, 5" stroke-linecap="round" />
  <line x1="274" y1="158" x2="294" y2="158" stroke="#000000" stroke-width="4" stroke-dasharray="5, 5" stroke-linecap="round" />
  <path d="M 290,44 L 302,52 L 290,60 Z" fill="#000000" />
  <path d="M 290,150 L 302,158 L 290,166 Z" fill="#000000" />

  <!-- 搬送先1（上段コンテナ：音色A ♪） -->
  <path d="M 306,26 L 312,26 L 317,76 L 355,76 L 360,26 L 366,26" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
